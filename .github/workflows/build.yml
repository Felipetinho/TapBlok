name: Build APK

# Roda a cada push na main, e também permite rodar manualmente pelo botão.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar o APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TapBlok-apk
          path: app/build/outputs/apk/debug/*.apk
